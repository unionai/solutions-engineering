[project]
name = "chat-app"
version = "0.1.0"
description = "Exercise 2: Real-Time RAG Chat App"
requires-python = ">=3.12"
dependencies = [
    "flyte>=2.0.0b35",
    "anthropic",
    "chromadb",
    "fastapi",
    "uvicorn",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
