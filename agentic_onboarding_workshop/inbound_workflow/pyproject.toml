[project]
name = "inbound-workflow"
version = "0.1.0"
description = "Exercise 3: Multi-Agent Quote Workflow with Human-in-the-Loop"
requires-python = ">=3.12"
dependencies = [
    "flyte>=2.0.0b35",
    "openai-agents>=0.2.4",
    "flyteplugins-hitl>=2.0.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "unionai-reuse>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
